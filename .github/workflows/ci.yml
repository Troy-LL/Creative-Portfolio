name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  deploy-sanity:
    name: deploy-sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install
        run: npm ci
      - name: Assert redesign root + archived desktop
        run: |
          test -f index.html
          grep -q 'data-surface="redesign"' index.html
          test -f vercel.json
          node -e "JSON.parse(require('fs').readFileSync('vercel.json','utf8'))"
          test -f archive/desktop-os/index.html
          test -f archive/desktop-os/assets/js/app.js
          test -d archive/desktop-os/assets/founders-cafe
          test -n "$(find archive/desktop-os/assets/founders-cafe -type f | head -1)"

  e2e:
    name: e2e
    needs: deploy-sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Playwright
        run: npx playwright test
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
