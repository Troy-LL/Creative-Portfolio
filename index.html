<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Troy Lazaro</title>
    <meta
      name="description"
      content="Troy Lazaro — AI Engineer. Calling card."
    />
    <link rel="stylesheet" href="calling-card/src/components/Card/Card.css" />
    <link rel="stylesheet" href="assets/css/card-back-fonts.css" />
    <link rel="stylesheet" href="assets/css/card-lab.css" />
  </head>
  <body data-surface="redesign-stub">
    <main class="site-stage" aria-label="Calling card">
      <section class="pane" data-engine="css">
        <div class="pane-fps" aria-hidden="true">— fps</div>
        <p class="css-scroll-hint" data-visible="false" aria-hidden="true">
          scroll down
        </p>
        <div class="css-stage">
          <div class="css-world">
            <div class="css-rig">
              <div class="css-stack">
                <div class="css-shadows" aria-hidden="true">
                  <div class="css-shadow css-shadow--soft"></div>
                  <div class="css-shadow css-shadow--contact"></div>
                </div>
                <div class="css-hatch-slot" aria-hidden="true">
                  <div class="css-hatch-well"></div>
                  <div class="css-hatch"></div>
                </div>
                <article class="css-card css-card--fold">
                <div class="css-card__flip">
                <div class="css-card__front">
                <div class="fold-sheet">
                  <div class="fold-panel fold-panel--top" data-fold="top">
                    <div class="fold-panel__face">
                      <div class="fold-panel__clip">
                        <div
                          class="fold-panel__print"
                          style="transform: translateY(0%)"
                        >
                          <div
                            class="css-card__material"
                            data-physical-host
                            data-third="0"
                          ></div>
                        </div>
                      </div>
                      <span
                        class="fold-panel__shade fold-panel__shade--top"
                        aria-hidden="true"
                      ></span>
                      <span class="fold-panel__edge" aria-hidden="true"></span>
                      <span class="fold-panel__crease fold-panel__crease--bottom"></span>
                      <span class="fold-panel__thickness" aria-hidden="true"></span>
                    </div>
                    <div class="fold-panel fold-panel--mid" data-fold="mid">
                      <div class="fold-panel__face css-card__face">
                        <div class="fold-panel__clip">
                          <div
                            class="fold-panel__print"
                            style="transform: translateY(-33.333%)"
                          >
                            <div
                              class="css-card__material"
                              data-physical-host
                              data-third="1"
                            ></div>
                          </div>
                        </div>
                        <span
                          class="fold-panel__shade fold-panel__shade--mid"
                          aria-hidden="true"
                        ></span>
                        <span class="fold-panel__edge" aria-hidden="true"></span>
                        <span class="fold-panel__crease fold-panel__crease--top"></span>
                        <span class="fold-panel__crease fold-panel__crease--bottom"></span>
                      </div>
                      <div class="fold-panel fold-panel--bot" data-fold="bot">
                        <div class="fold-panel__face">
                          <div class="fold-panel__clip">
                            <div
                              class="fold-panel__print"
                              style="transform: translateY(-66.666%)"
                            >
                              <div
                                class="css-card__material"
                                data-physical-host
                                data-third="2"
                              ></div>
                            </div>
                          </div>
                          <span
                            class="fold-panel__shade fold-panel__shade--bot"
                            aria-hidden="true"
                          ></span>
                          <span class="fold-panel__edge" aria-hidden="true"></span>
                          <span class="fold-panel__crease fold-panel__crease--top"></span>
                          <span class="fold-panel__thickness" aria-hidden="true"></span>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
                </div>
                <div class="css-card__back" aria-hidden="true">
                  <div
                    class="css-card__back-stock"
                    data-physical-host
                    data-card-back
                  ></div>
                </div>
                </div>
              </article>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- Dev / dial chrome — off by default. Toggle with L or ?lab=1 -->
    <aside class="lab-devtools" id="lab-devtools" hidden>
      <header class="lab-head">
        <div>
          <h1>Card lab</h1>
          <p>Developer dial. Press <kbd>L</kbd> to hide · <kbd>Space</kbd> replay · <code>?debug=1</code> skip fall.</p>
        </div>
        <div class="lab-actions">
          <button type="button" id="replay">Replay drop</button>
          <button
            type="button"
            id="text-effects"
            aria-pressed="false"
            title="Toggle grain, absorption, and relief on the ink"
          >
            Flat ink
          </button>
          <button
            type="button"
            id="paper-grain"
            class="is-active"
            aria-pressed="true"
            title="Toggle paper tooth / surface light map"
          >
            Paper grain
          </button>
          <span class="lab-link"
            ><a href="/archive/desktop-os/">Archived desktop</a></span
          >
        </div>
      </header>

      <fieldset class="lab-motion">
        <legend>Motion</legend>
        <label
          ><input type="radio" name="motion" value="straight" /> Straight
          drop</label
        >
        <label
          ><input type="radio" name="motion" value="organic" /> Organic
          drop</label
        >
        <label
          ><input type="radio" name="motion" value="curved" checked /> Curved
          fall</label
        >
      </fieldset>

      <details class="lab-debug" id="mat-debug">
        <summary>
          Material <span class="lab-debug__hint">paper · ink · type · back</span>
        </summary>
        <div class="lab-debug__presets" data-stock-presets>
          <button type="button" data-stock="#f4f2ea" class="is-active">#F4F2EA</button>
          <button type="button" data-stock="#f3f1e9">#F3F1E9</button>
          <button type="button" data-stock="#f5f3ec">#F5F3EC</button>
          <button type="button" data-stock="#f1f0e9">#F1F0E9</button>
          <button type="button" data-stock="#eae6dc">#EAE6DC</button>
        </div>
        <div class="lab-debug__grid">
          <label
            >Paper base
            <input data-mat="paperBase" type="color" value="#f4f2ea"
          /></label>
          <label
            >Surface light (brightness)
            <strong data-mat-val="litOpacity">0.14</strong>
            <input
              data-mat="litOpacity"
              type="range"
              min="0.03"
              max="0.22"
              step="0.005"
              value="0.14"
          /></label>
          <label
            >Ink color
            <input data-mat="inkColor" type="color" value="#1a1814"
          /></label>
          <label
            >Ink density (opacity)
            <strong data-mat-val="density">0.84</strong>
            <input
              data-mat="density"
              type="range"
              min="0.5"
              max="1"
              step="0.01"
              value="0.84"
          /></label>
          <label
            >Ink grain
            <strong data-mat-val="grain">0.00</strong>
            <input
              data-mat="grain"
              type="range"
              min="0"
              max="1"
              step="0.01"
              value="0"
          /></label>
          <label
            >Print absorption
            <strong data-mat-val="absorption">0.00</strong>
            <input
              data-mat="absorption"
              type="range"
              min="0"
              max="1"
              step="0.01"
              value="0"
          /></label>
          <label
            >Print relief
            <strong data-mat-val="relief">0.00</strong>
            <input
              data-mat="relief"
              type="range"
              min="0"
              max="1"
              step="0.01"
              value="0"
          /></label>
          <label
            >Type scale
            <strong data-mat-val="typeScale">1.00</strong>
            <input
              data-mat="typeScale"
              type="range"
              min="0.75"
              max="1.45"
              step="0.01"
              value="1"
          /></label>
          <label
            >Card width (px)
            <strong data-mat-val="cardWidth">420</strong>
            <input
              data-mat="cardWidth"
              type="range"
              min="280"
              max="560"
              step="4"
              value="420"
          /></label>
        </div>
        <div class="lab-debug__grid lab-debug__grid--back">
          <p class="lab-debug__section-label">Back</p>
          <label
            >Initials font
            <select data-mat="backFont">
              <option value="dancing-script-regular">Dancing Script regular</option>
              <option value="front-face">Front face (Copperplate)</option>
              <option value="boska-italic">Boska italic</option>
              <option value="boska-regular">Boska regular</option>
              <option value="gambetta-italic">Gambetta italic</option>
              <option value="gambetta-regular">Gambetta regular</option>
              <option value="switzer-regular">Switzer regular</option>
              <option value="switzer-light">Switzer light</option>
            </select></label
          >
        </div>
        <div class="lab-debug__actions">
          <button type="button" data-mat-reset>Reset material</button>
        </div>
      </details>

      <details class="lab-debug" id="cursor-debug">
        <summary>
          Cursor lean <span class="lab-debug__hint">pick-up feel</span>
        </summary>
        <div class="lab-debug__grid">
          <label
            >Tilt Y <strong data-cur-val="rotY">9.00</strong>
            <input data-cur="rotY" type="range" min="0" max="18" step="0.1" value="9"
          /></label>
          <label
            >Tilt X <strong data-cur-val="rotX">6.50</strong>
            <input data-cur="rotX" type="range" min="0" max="14" step="0.1" value="6.5"
          /></label>
          <label
            >Lift base <strong data-cur-val="liftBase">1.80</strong>
            <input
              data-cur="liftBase"
              type="range"
              min="0"
              max="6"
              step="0.1"
              value="1.8"
          /></label>
          <label
            >Lift peak <strong data-cur-val="liftPeak">3.80</strong>
            <input
              data-cur="liftPeak"
              type="range"
              min="0"
              max="10"
              step="0.1"
              value="3.8"
          /></label>
          <label
            >Slide X <strong data-cur-val="xyX">7.50</strong>
            <input data-cur="xyX" type="range" min="0" max="16" step="0.1" value="7.5"
          /></label>
          <label
            >Slide Y <strong data-cur-val="xyY">5.50</strong>
            <input data-cur="xyY" type="range" min="0" max="12" step="0.1" value="5.5"
          /></label>
        </div>
        <div class="lab-debug__actions">
          <button type="button" data-cur-reset>Reset cursor</button>
        </div>
      </details>

      <details class="lab-debug" id="fold-debug">
        <summary>
          Fold + opening <span class="lab-debug__hint">same surface · degrees</span>
        </summary>
        <div class="lab-debug__grid">
          <label
            >Fold progress <strong data-open-val="fold">0.00</strong>
            <input
              data-open="fold"
              type="range"
              min="0"
              max="1"
              step="0.01"
              value="0"
          /></label>
          <label
            >Flip duration (ms) <strong data-flip-val="ms">900</strong>
            <input
              data-flip="ms"
              type="range"
              min="250"
              max="2000"
              step="50"
              value="900"
          /></label>
          <label
            >Top <strong data-fold-val="top">20</strong>
            <input data-fold="top" type="range" min="-180" max="180" step="1" value="20"
          /></label>
          <label
            >Mid <strong data-fold-val="mid">103</strong>
            <input data-fold="mid" type="range" min="-180" max="180" step="1" value="103"
          /></label>
          <label
            >Bot <strong data-fold-val="bot">-111</strong>
            <input data-fold="bot" type="range" min="-180" max="180" step="1" value="-111"
          /></label>
          <label
            >View tip <strong data-fold-val="viewTip">-1</strong>
            <input
              data-fold="viewTip"
              type="range"
              min="-40"
              max="40"
              step="1"
              value="-1"
          /></label>
          <label
            >Height scale <strong data-hatch-val="heightScale">1.50</strong>
            <input
              data-hatch="heightScale"
              type="range"
              min="0.5"
              max="1.5"
              step="0.01"
              value="1.5"
          /></label>
          <label
            >Extend bottom <strong data-hatch-val="extendBottomPct">0.40</strong>
            <input
              data-hatch="extendBottomPct"
              type="range"
              min="0"
              max="0.5"
              step="0.01"
              value="0.4"
          /></label>
          <label
            >Pull reveal <strong data-hatch-val="topPullPct">0.00</strong>
            <input
              data-hatch="topPullPct"
              type="range"
              min="0"
              max="0.6"
              step="0.01"
              value="0"
          /></label>
          <label
            >Card lift Z <strong data-hatch-val="layerZ">80</strong>
            <input
              data-hatch="layerZ"
              type="range"
              min="48"
              max="120"
              step="1"
              value="80"
          /></label>
          <label
            >Well opacity <strong data-hatch-val="wellOpacity">1.00</strong>
            <input
              data-hatch="wellOpacity"
              type="range"
              min="0"
              max="1"
              step="0.05"
              value="1"
          /></label>
        </div>
        <div class="lab-debug__actions">
          <button type="button" data-fold-reset>Reset fold</button>
          <button type="button" data-hatch-reset>Reset opening</button>
        </div>
      </details>

      <details class="lab-debug" id="phys-debug">
        <summary>
          Physicality <span class="lab-debug__hint">fall · flat shadow · autosaved</span>
        </summary>
        <div class="lab-debug__grid">
          <label
            >Curve amount <strong data-phys-val="curveAmount">1.60</strong>
            <input
              data-phys="curveAmount"
              type="range"
              min="0"
              max="1.6"
              step="0.02"
              value="1.6"
          /></label>
          <label
            >Fall duration (ms) <strong data-phys-val="fallMs">1400.00</strong>
            <input
              data-phys="fallMs"
              type="range"
              min="900"
              max="3600"
              step="50"
              value="1400"
          /></label>
          <label
            >Lateral drift <strong data-phys-val="lateralDrift">0.86</strong>
            <input
              data-phys="lateralDrift"
              type="range"
              min="0"
              max="1.8"
              step="0.02"
              value="0.86"
          /></label>
          <label
            >Rotation response
            <strong data-phys-val="rotationResponse">0.70</strong>
            <input
              data-phys="rotationResponse"
              type="range"
              min="0"
              max="1.8"
              step="0.02"
              value="0.7"
          /></label>
          <label
            >Rotation inertia
            <strong data-phys-val="rotationInertia">0.95</strong>
            <input
              data-phys="rotationInertia"
              type="range"
              min="0"
              max="0.95"
              step="0.01"
              value="0.95"
          /></label>
          <label
            >Cursor influence
            <strong data-phys-val="cursorInfluence">1.00</strong>
            <input
              data-phys="cursorInfluence"
              type="range"
              min="0"
              max="1.4"
              step="0.02"
              value="1"
          /></label>
          <label
            >Gravity <strong data-phys-val="gravity">2.00</strong>
            <input
              data-phys="gravity"
              type="range"
              min="0.7"
              max="2"
              step="0.02"
              value="2"
          /></label>
          <label
            >Air resistance <strong data-phys-val="airResistance">0.30</strong>
            <input
              data-phys="airResistance"
              type="range"
              min="0"
              max="0.5"
              step="0.01"
              value="0.3"
          /></label>
          <label
            >Fall shadow strength
            <strong data-phys-val="fallShadowStrength">0.48</strong>
            <input
              data-phys="fallShadowStrength"
              type="range"
              min="0"
              max="1.6"
              step="0.02"
              value="0.48"
          /></label>
          <label
            >Fall shadow softness
            <strong data-phys-val="fallShadowSoftness">1.85</strong>
            <input
              data-phys="fallShadowSoftness"
              type="range"
              min="0.2"
              max="2"
              step="0.02"
              value="1.85"
          /></label>
          <label
            >Fall shadow size
            <strong data-phys-val="fallShadowScale">1.12</strong>
            <input
              data-phys="fallShadowScale"
              type="range"
              min="0.5"
              max="2.2"
              step="0.02"
              value="1.12"
              title="Cast size while falling"
          /></label>
          <label
            >Fall shadow reach
            <strong data-phys-val="fallShadowReach">1.25</strong>
            <input
              data-phys="fallShadowReach"
              type="range"
              min="0.25"
              max="2.4"
              step="0.02"
              value="1.25"
              title="How far the cast stretches while falling"
          /></label>
          <label
            >Flat shadow strength
            <strong data-phys-val="flatShadowStrength">0.34</strong>
            <input
              data-phys="flatShadowStrength"
              type="range"
              min="0"
              max="1.6"
              step="0.02"
              value="0.34"
          /></label>
          <label
            >Flat shadow softness
            <strong data-phys-val="flatShadowSoftness">1.55</strong>
            <input
              data-phys="flatShadowSoftness"
              type="range"
              min="0.2"
              max="2"
              step="0.02"
              value="1.55"
          /></label>
          <label
            >Flat shadow size
            <strong data-phys-val="flatShadowScale">0.96</strong>
            <input
              data-phys="flatShadowScale"
              type="range"
              min="0.5"
              max="2.2"
              step="0.02"
              value="0.96"
              title="Cast size when resting on the table"
          /></label>
          <label
            >Flat shadow reach
            <strong data-phys-val="flatShadowReach">0.85</strong>
            <input
              data-phys="flatShadowReach"
              type="range"
              min="0.25"
              max="2.4"
              step="0.02"
              value="0.85"
              title="How far the cast stretches when flat"
          /></label>
          <label
            >Perspective <strong data-phys-val="perspective">590.00</strong>
            <input
              data-phys="perspective"
              type="range"
              min="420"
              max="1400"
              step="10"
              value="590"
          /></label>
        </div>
        <div class="lab-debug__actions">
          <button type="button" data-phys-reset>Reset defaults</button>
        </div>
      </details>
    </aside>

    <script type="module" src="assets/js/card-lab.js"></script>
  </body>
</html>
